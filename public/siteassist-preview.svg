    <path d="m119 176 22-13c5-3 8-1 8 4v8c0 2-1 4-3 5l-20 12c-5 3-8 1-8-3v-8c0-2 0-4 1-5Zm0 28 22-13c5-3 8-1 8 4v8c0 2-1 4-3 5l-20 12c-5 3-8 1-8-3v-8c0-2 0-4 1-5Z" fill="#ff5200"/>
    <text x="165" y="197" font-size="21" font-weight="700" fill="#171717">SiteAssist</text>
    <rect x="103" y="251" width="186" height="35" rx="6" fill="#efefef"/>
    <text x="123" y="274" font-size="15" font-weight="700" fill="#202020">Overview</text>
    <text x="123" y="322" font-size="15" fill="#545454">Conversations</text>
    <text x="123" y="366" font-size="15" fill="#545454">Assistants</text>
    <text x="123" y="410" font-size="15" fill="#545454">Knowledge Base</text>
    <text x="344" y="191" font-size="27" font-weight="700" fill="#1f1f1f">Overview</text>
