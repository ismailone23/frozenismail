    <path d="m1069 521h12m-5-5 5 5-5 5" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    <text x="921" y="586" text-anchor="middle" font-size="12" fill="#848484">Powered by SiteAssist</text>
