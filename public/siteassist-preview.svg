<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SiteAssist platform preview</title>
  <desc id="desc">Illustrative preview of the SiteAssist dashboard and a website assistant answering a visitor question.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#292929"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="browser"><rect x="84" y="86" width="893" height="495" rx="12"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="#101010"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1004" cy="90" r="210" fill="#fff" opacity=".025"/>

  <g filter="url(#shadow)" clip-path="url(#browser)" font-family="Arial, sans-serif">
