  <rect x="84" y="86" width="893" height="495" rx="12" fill="none" stroke="#444"/>

  <g filter="url(#shadow)">
    <rect x="721" y="67" width="399" height="542" rx="14" fill="#fff"/>
    <rect x="721" y="67" width="399" height="542" rx="14" fill="none" stroke="#dedede"/>
  </g>
  <g font-family="Arial, sans-serif">
