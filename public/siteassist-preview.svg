    <path d="M752 102 769 92c3-2 5 0 5 3v5c0 2-1 3-3 4l-17 10c-3 2-5 0-5-3v-5c0-2 1-3 3-4Zm0 16 17-10c3-2 5 0 5 3v5c0 2-1 3-3 4l-17 10c-3 2-5 0-5-3v-5c0-2 1-3 3-4Z" fill="#fff"/>
