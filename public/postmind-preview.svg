<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">PostMind app preview</title>
  <desc id="desc">Illustrative preview of PostMind's idea-to-post workflow and mobile writing interface.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#292929"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="phone"><rect x="751" y="81" width="288" height="516" rx="29"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="#101010"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1004" cy="90" r="210" fill="#fff" opacity=".025"/>

  <g filter="url(#shadow)">
    <rect x="105" y="122" width="665" height="422" rx="14" fill="#f8f8f8"/>
    <rect x="105" y="122" width="665" height="422" rx="14" fill="none" stroke="#d7d7d7"/>
  </g>
  <g font-family="Arial, sans-serif">
    <circle cx="137" cy="153" r="5" fill="#c9c9c9"/>
    <circle cx="154" cy="153" r="5" fill="#c9c9c9"/>
    <circle cx="171" cy="153" r="5" fill="#c9c9c9"/>
    <path d="M105 178h665" stroke="#e3e3e3"/>
    <text x="142" y="226" font-size="24" font-weight="700" fill="#111115">PostMind</text>
    <text x="142" y="254" font-size="15" fill="#66666b">Posts · Threads · Replies</text>
    <text x="142" y="307" font-size="17" font-weight="700" fill="#222226">Start with an idea</text>
    <rect x="142" y="326" width="503" height="91" rx="9" fill="#fff" stroke="#dcdce0"/>
    <text x="160" y="356" font-size="16" fill="#62626b">What would you like to write about?</text>
    <path d="M160 381h270" stroke="#e6e6e9" stroke-width="8" stroke-linecap="round"/>
    <rect x="142" y="446" width="99" height="36" rx="18" fill="#111115"/>
    <text x="192" y="469" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Post</text>
    <rect x="250" y="446" width="108" height="36" rx="18" fill="#fff" stroke="#dedee1"/>
    <text x="304" y="469" font-size="14" fill="#34343a" text-anchor="middle">Thread</text>
    <rect x="367" y="446" width="98" height="36" rx="18" fill="#fff" stroke="#dedee1"/>
    <text x="416" y="469" font-size="14" fill="#34343a" text-anchor="middle">Reply</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="733" y="41" width="324" height="594" rx="43" fill="#070709" stroke="#4d4d50" stroke-width="2"/>
    <rect x="751" y="81" width="288" height="516" rx="29" fill="#fff"/>
  </g>
  <g clip-path="url(#phone)" font-family="Arial, sans-serif">
    <rect x="751" y="81" width="288" height="516" fill="#fbfbfc"/>
    <text x="775" y="119" font-size="19" font-weight="700" fill="#151519">PostMind</text>
    <circle cx="1005" cy="112" r="13" fill="#111115"/>
    <path d="M998 119c3-9 9-14 15-14 0 7-3 11-11 14l-4 4 2-5Z" fill="#fff"/>
    <path d="M786 144h217" stroke="#e4e4e8"/>
    <text x="775" y="186" font-size="24" font-weight="700" fill="#151519">Write in your voice.</text>
    <text x="775" y="211" font-size="14" fill="#6a6a73">Ideas into posts and threads.</text>
    <rect x="775" y="241" width="240" height="175" rx="14" fill="#fff" stroke="#e4e4e8"/>
    <text x="791" y="273" font-size="13" font-weight="700" fill="#33333a">YOUR IDEA</text>
    <path d="M792 300h177M792 320h204M792 340h156" stroke="#dadbe0" stroke-width="8" stroke-linecap="round"/>
    <rect x="791" y="371" width="102" height="27" rx="13.5" fill="#f2f2f4"/>
    <text x="842" y="389" text-anchor="middle" font-size="12" fill="#50505a">Your style</text>
    <rect x="775" y="436" width="240" height="47" rx="11" fill="#111115"/>
    <text x="895" y="466" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Generate post  ↗</text>
    <text x="775" y="523" font-size="15" font-weight="700" fill="#151519">Recent drafts</text>
    <path d="M775 547h198M775 563h143" stroke="#e2e2e6" stroke-width="8" stroke-linecap="round"/>
  </g>
  <rect x="837" y="62" width="116" height="24" rx="12" fill="#070709"/>
  <path d="M865 615h60" stroke="#c7c7c9" stroke-width="4" stroke-linecap="round"/>
</svg>
