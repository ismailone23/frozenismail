<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Faculty Evaluation Helper extension preview</title>
  <desc id="desc">An illustrative preview of the MIST faculty evaluation browser extension alongside the student portal.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#292929" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <clipPath id="browser-clip"><rect x="100" y="92" width="735" height="492" rx="12"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="#101010"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1023" cy="81" r="212" fill="#fff" opacity=".025"/>

  <!-- Student portal context, deliberately abstracted rather than a real account screenshot. -->
  <g filter="url(#shadow)" clip-path="url(#browser-clip)">
    <rect x="100" y="92" width="735" height="492" fill="#f7f8fa"/>
    <rect x="100" y="92" width="735" height="48" fill="#e9ebef"/>
    <circle cx="129" cy="116" r="5" fill="#c9cdd3"/>
    <circle cx="148" cy="116" r="5" fill="#c9cdd3"/>
    <circle cx="167" cy="116" r="5" fill="#c9cdd3"/>
    <rect x="198" y="103" width="510" height="26" rx="6" fill="#fff"/>
    <text x="217" y="121" fill="#68717c" font-family="Arial, sans-serif" font-size="12">student.mist.ac.bd / semester-evaluation</text>
    <rect x="100" y="140" width="735" height="66" fill="#fff"/>
    <text x="135" y="180" fill="#24344a" font-family="Arial, sans-serif" font-size="20" font-weight="700">MIST Student Portal</text>
    <rect x="135" y="240" width="265" height="12" rx="6" fill="#d7dee6"/>
    <rect x="135" y="266" width="198" height="9" rx="4.5" fill="#e1e6eb"/>
    <rect x="135" y="315" width="377" height="74" rx="8" fill="#fff" stroke="#e0e5ea"/>
    <rect x="157" y="337" width="144" height="10" rx="5" fill="#bbc5d1"/>
    <rect x="157" y="357" width="232" height="8" rx="4" fill="#e2e7ec"/>
    <rect x="135" y="402" width="377" height="74" rx="8" fill="#fff" stroke="#e0e5ea"/>
    <rect x="157" y="425" width="188" height="10" rx="5" fill="#bbc5d1"/>
    <rect x="157" y="445" width="207" height="8" rx="4" fill="#e2e7ec"/>
    <rect x="135" y="489" width="377" height="74" rx="8" fill="#fff" stroke="#e0e5ea"/>
    <rect x="157" y="512" width="164" height="10" rx="5" fill="#bbc5d1"/>
    <rect x="157" y="532" width="245" height="8" rx="4" fill="#e2e7ec"/>
  </g>
  <rect x="100" y="92" width="735" height="492" rx="12" fill="none" stroke="#444"/>

  <!-- Popup modeled on the extension's real labels, modes, and controls. -->
  <g filter="url(#shadow)">
    <rect x="613" y="44" width="480" height="590" rx="11" fill="#fff"/>
    <rect x="613" y="44" width="480" height="590" rx="11" fill="none" stroke="#dadce0"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="643" y="93" fill="#202124" font-size="27" font-weight="700">Faculty Evaluation</text>
    <text x="643" y="119" fill="#5f6368" font-size="16">Set your answers. Take it from here.</text>
    <path d="M643 143h420M643 187h420" stroke="#dadce0"/>
    <circle cx="650" cy="165" r="5" fill="#188038"/>
    <text x="665" y="170" fill="#202124" font-size="15">Connected to MIST portal</text>
    <text x="984" y="170" fill="#185abc" font-size="14">Open portal</text>
    <text x="643" y="221" fill="#202124" font-size="16" font-weight="700">Run mode</text>
    <rect x="643" y="234" width="420" height="47" rx="6" fill="#fff" stroke="#dadce0"/>
    <text x="657" y="263" fill="#202124" font-size="16">Fill only · one evaluation</text>
    <path d="m1034 253 6 6 6-6" fill="none" stroke="#5f6368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="643" y="302" fill="#5f6368" font-size="14">Leaves the form open for your review.</text>
    <text x="643" y="342" fill="#202124" font-size="16" font-weight="700">Rating for all questions</text>
    <rect x="643" y="355" width="420" height="47" rx="6" fill="#fff" stroke="#dadce0"/>
    <text x="657" y="384" fill="#202124" font-size="16">Very Good</text>
    <path d="m1034 374 6 6 6-6" fill="none" stroke="#5f6368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M643 422h420M643 465h420" stroke="#dadce0"/>
    <text x="643" y="449" fill="#202124" font-size="16" font-weight="700">Comments</text>
    <text x="899" y="449" fill="#5f6368" font-size="13">Used by Fill &amp; submit</text>
    <text x="643" y="492" fill="#202124" font-size="16" font-weight="700">Run settings</text>
    <text x="969" y="492" fill="#5f6368" font-size="13">Limits &amp; timing</text>
    <rect x="643" y="510" width="420" height="62" rx="6" fill="#f1f3f4"/>
    <text x="660" y="537" fill="#202124" font-size="15" font-weight="700">Ready when you are</text>
    <text x="660" y="557" fill="#5f6368" font-size="13">Open an evaluation to begin.</text>
    <rect x="643" y="582" width="420" height="39" rx="6" fill="#185abc"/>
    <text x="853" y="607" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Fill evaluation</text>
  </g>
</svg>
